<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="橘子岛 Orange Island 开放审核答题入口" />
  <title>审核答题 - 橘子岛 Orange Island</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand">🍊 橘子岛</a>
      <nav>
        <a href="index.html">首页</a>
        <a href="rules.html">使用规则</a>
        <a href="quiz.html" class="active">审核答题</a>
      </nav>
    </div>
  </header>

  <main id="quiz-container">
    <div id="quiz-loading" style="display: none; text-align: center; padding: 40px;">
      <div class="loading"></div>
      <p>加载中...</p>
    </div>

    <div id="quiz-alert" class="alert"></div>

    <div id="step-login" class="quiz-step active">
      <div class="card">
        <h2>开放审核答题</h2>
        <p style="color: var(--text-secondary);">
          请完整阅读 <a href="rules.html">使用规则</a> 后答题。题目从题库中随机抽取，必须全部答对才能通过审核。
        </p>

        <div class="form-group">
          <label for="qq-input">QQ 号码</label>
          <input
            type="text"
            id="qq-input"
            inputmode="numeric"
            pattern="\d{5,11}"
            maxlength="11"
            placeholder="请输入你的 QQ 号"
            autocomplete="off"
          />
          <div class="input-hint">每个 QQ 号只能提交一次，请认真作答。</div>
        </div>

        <button id="start-btn" class="btn btn-primary">开始答题</button>
      </div>
    </div>

    <div id="step-quiz" class="quiz-step">
      <div class="card quiz-header">
        <div>
          <strong>答题中</strong>
          <div style="font-size: 0.85rem; color: var(--text-secondary);">
            进度条：<span id="progress-bar" style="display: inline-block; width: 0%; height: 6px; background: var(--primary); border-radius: 3px; vertical-align: middle; margin-left: 6px; transition: width 0.2s;"></span>
          </div>
        </div>
        <div class="timer" id="timer">--:--</div>
      </div>

      <div id="questions"></div>

      <div class="text-center mt-4">
        <button id="submit-btn" class="btn btn-primary">提交答案</button>
      </div>
    </div>

    <div id="step-result" class="quiz-step">
      <div id="result-box"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> 橘子岛 Orange Island. 保留所有权利。</p>
      <p><a id="github-link" href="#" target="_blank" rel="noopener">GitHub</a></p>
    </div>
  </footer>

  <!-- Supabase JS client (local, no external CDN dependency) -->
  <script src="assets/supabase.min.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/supabase-client.js"></script>
  <script src="assets/quiz.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    const gh = window.ORANGE_ISLAND_CONFIG?.GITHUB_URL;
    if (gh) document.getElementById('github-link').href = gh;
  </script>
</body>
</html>
