<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="橘子岛 Orange Island 审核答题后台" />
  <title>审核后台 - 橘子岛 Orange Island</title>
  <link rel="stylesheet" href="assets/style.css" />
  <style>
    .admin-table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 0.9rem; }
    .admin-table th, .admin-table td { border: 1px solid var(--border); padding: 10px; text-align: left; }
    .admin-table th { background: var(--bg); }
    .admin-table tr.passed td { background: rgba(40, 167, 69, 0.06); }
    .admin-table tr.failed td { background: rgba(220, 53, 69, 0.04); }
    .stats { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; min-width: 120px; }
    .stat-card .number { font-size: 1.6rem; font-weight: 700; }
    .stat-card .label { font-size: 0.85rem; color: var(--text-secondary); }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand">🍊 橘子岛</a>
      <nav>
        <a href="index.html">首页</a>
        <a href="rules.html">使用规则</a>
        <a href="quiz.html">审核答题</a>
      </nav>
    </div>
  </header>

  <main class="container" style="padding: 30px 20px 60px;">
    <h1>审核答题后台</h1>

    <div id="login-box" class="card">
      <h2>管理员登录</h2>
      <p style="color: var(--text-secondary);">Token 在 Supabase Studio → Table Editor → <code>admin_settings</code> 中查看。</p>
      <div id="admin-alert" class="alert"></div>
      <div class="form-group">
        <label for="admin-token">Admin Token</label>
        <input type="password" id="admin-token" placeholder="输入 admin_token" autocomplete="off" />
      </div>
      <button id="login-btn" class="btn btn-primary">查看数据</button>
    </div>

    <div id="dashboard" class="hidden">
      <div class="stats">
        <div class="stat-card">
          <div class="number" id="stat-total">-</div>
          <div class="label">总提交</div>
        </div>
        <div class="stat-card">
          <div class="number" id="stat-passed">-</div>
          <div class="label">通过</div>
        </div>
        <div class="stat-card">
          <div class="number" id="stat-failed">-</div>
          <div class="label">未通过</div>
        </div>
      </div>

      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
          <h2 style="margin: 0;">提交记录</h2>
          <button id="export-btn" class="btn btn-secondary">导出 CSV</button>
        </div>
        <div style="overflow-x: auto;">
          <table class="admin-table">
            <thead>
              <tr>
                <th>提交时间</th>
                <th>QQ 号</th>
                <th>得分</th>
                <th>结果</th>
              </tr>
            </thead>
            <tbody id="submissions-body"></tbody>
          </table>
        </div>
        <p id="empty-tip" class="hidden" style="color: var(--text-secondary);">暂无提交记录。</p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> 橘子岛 Orange Island. 保留所有权利。</p>
    </div>
  </footer>

  <script src="assets/supabase.min.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/supabase-client.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const loginBox = document.getElementById('login-box');
    const dashboard = document.getElementById('dashboard');
    const alertBox = document.getElementById('admin-alert');
    const tokenInput = document.getElementById('admin-token');
    let adminToken = '';
    let submissionsCache = [];

    function showAlert(msg, type = 'error') {
      alertBox.className = `alert alert-${type} show`;
      alertBox.textContent = msg;
    }
    function hideAlert() {
      alertBox.className = 'alert';
      alertBox.textContent = '';
    }

    async function loadData() {
      adminToken = tokenInput.value.trim();
      if (!adminToken) {
        showAlert('请输入 Admin Token');
        return;
      }

      const { OrangeIslandSupabase } = window;
      const { data: stats, error: statsErr } = await OrangeIslandSupabase.client.rpc('get_submission_stats', {
        p_token: adminToken,
      });
      if (statsErr) {
        showAlert('Token 无效或查询失败：' + statsErr.message);
        return;
      }

      const { data: rows, error: rowsErr } = await OrangeIslandSupabase.client.rpc('get_submissions', {
        p_token: adminToken,
      });
      if (rowsErr) {
        showAlert('查询失败：' + rowsErr.message);
        return;
      }

      hideAlert();
      submissionsCache = rows || [];
      renderStats(stats);
      renderTable(submissionsCache);
      loginBox.classList.add('hidden');
      dashboard.classList.remove('hidden');
    }

    function renderStats(stats) {
      document.getElementById('stat-total').textContent = stats?.total ?? 0;
      document.getElementById('stat-passed').textContent = stats?.passed ?? 0;
      document.getElementById('stat-failed').textContent = stats?.failed ?? 0;
    }

    function renderTable(rows) {
      const tbody = document.getElementById('submissions-body');
      const emptyTip = document.getElementById('empty-tip');
      tbody.innerHTML = '';

      if (!rows.length) {
        emptyTip.classList.remove('hidden');
        return;
      }
      emptyTip.classList.add('hidden');

      rows.forEach((row) => {
        const tr = document.createElement('tr');
        tr.className = row.passed ? 'passed' : 'failed';
        const time = row.submitted_at
          ? new Date(row.submitted_at).toLocaleString('zh-CN')
          : '-';
        tr.innerHTML = `
          <td>${time}</td>
          <td>${row.qq_number}</td>
          <td>${row.score} / ${Object.keys(row.answers || {}).length}</td>
          <td>${row.passed ? '✅ 通过' : '❌ 未通过'}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function exportCsv() {
      if (!submissionsCache.length) return;
      const header = ['提交时间', 'QQ号', '得分', '是否通过'];
      const rows = submissionsCache.map((r) => [
        r.submitted_at ? new Date(r.submitted_at).toLocaleString('zh-CN') : '',
        r.qq_number,
        `${r.score}/${Object.keys(r.answers || {}).length}`,
        r.passed ? '通过' : '未通过',
      ]);
      const csv = [header, ...rows]
        .map((row) => row.map((cell) => `"${String(cell).replace(/"/g, '""')}"`).join(','))
        .join('\n');
      const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `orange-island-submissions-${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    document.getElementById('login-btn').addEventListener('click', loadData);
    tokenInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') loadData();
    });
    document.getElementById('export-btn').addEventListener('click', exportCsv);
  </script>
</body>
</html>
