<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0b0910"><title>网易云一起听</title><style>
:root{--bg:#0b0910;--panel:#17131f;--line:#33293f;--text:#f8f4fb;--muted:#aaa0b6;--accent:#b987ff;--danger:#ff9bb6;--warn:#ffd5a5}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{max-width:500px;margin:auto}button,input,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;padding:18px 18px 106px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.brand{font-size:19px;font-weight:800;color:#dfccff}.refresh{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#17131f;color:#eee;font-size:20px}.page{display:none}.page.active{display:block}.card,.lyric-card{background:rgba(23,19,31,.84);border:1px solid rgba(185,135,255,.22);border-radius:18px;padding:16px;margin:14px 0}.hero{text-align:center;padding:12px 0}.cover-shell{position:relative;width:min(70vw,290px);aspect-ratio:1;margin:auto auto 18px;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,#b689ff,#49385e)}.cover,.thumb{object-fit:cover}.cover{width:100%;height:100%;opacity:0}.cover.loaded{opacity:1}.cover-placeholder{position:absolute;inset:0;display:grid;place-items:center;font-size:80px;background:linear-gradient(135deg,#c39cff,#39294b)}.song-title{font-size:28px;font-weight:900}.artist{color:#c1b5cc;margin:8px 0}.state,.muted,.meta{font-size:13px;color:var(--muted)}.progress{width:100%;accent-color:var(--accent);opacity:.6}.time{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.controls,.actions,.searchbar{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.control{width:54px;height:54px;border-radius:50%;border:1px solid var(--line);background:#241c2e;color:#fff;font-size:24px}.control.primary{width:70px;height:70px;background:#b987ff;color:#21132d;font-size:32px}.control:disabled{opacity:.45}.btn{min-height:42px;border-radius:12px;border:1px solid var(--line);background:#241c2e;color:#fff;padding:9px 13px}.btn.primary{background:linear-gradient(135deg,#bf91ff,#a875f2);border:0;color:#1d1127;font-weight:800}.btn.small{min-height:34px;padding:6px 10px;font-size:12px}.notice,.errorbox{padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.65;word-break:break-word}.notice{background:rgba(89,62,32,.45);color:var(--warn)}.errorbox{background:rgba(91,37,52,.58);color:#ffc0cf}.hidden{display:none}.searchbar input,.field,textarea{min-width:0;flex:1;width:100%;border:1px solid var(--line);border-radius:13px;background:#120e19;color:#fff;padding:12px;outline:0}.searchbar .btn{flex:0 0 auto}.result{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid #33293f}.thumb{width:56px;height:56px;border-radius:12px;background:#3a2a49;flex:0 0 auto}.result-main{min-width:0;flex:1}.name{font-size:15px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(500px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#0e0a13;border-top:1px solid var(--line);padding:9px 5px 12px}.bottom button{border:0;background:none;color:var(--muted);font-size:12px}.bottom button.active{color:var(--accent)}.bottom i{display:block;font-style:normal;font-size:22px;margin-bottom:3px}.empty{text-align:center;color:var(--muted);padding:26px 10px;line-height:1.7}.chat{display:flex;gap:8px}.chat input{flex:1}.modal{display:none;position:fixed;inset:0;background:#040306c9;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modal-box{background:#17131f;border:1px solid var(--line);border-radius:18px;padding:18px;width:min(440px,100%)}
</style></head><body><div class="app"><header class="top"><div id="brand" class="brand">🎧 黑胶播放器</div><button id="refresh" class="refresh">↻</button></header>
<section class="page active" data-page="vinyl"><div class="hero"><div class="cover-shell"><div class="cover-placeholder">♪</div><img id="cover" class="cover"></div><div id="title" class="song-title">还没有读取到歌曲</div><div id="artist" class="artist">先在网易云播放一首歌吧</div><div id="state" class="state">等待媒体状态</div><div id="permission" class="notice hidden"></div><input id="progress" class="progress" type="range" min="0" max="1" value="0" disabled><div class="time"><span id="pos">0:00</span><span id="dur">0:00</span></div><div class="notice">视觉页只读显示媒体状态。播放、暂停、切歌和拖动进度不会发送聊天消息；控制请在当前对话调用橘岛内置 control_media。</div><div class="controls"><button class="control" disabled>⏮</button><button class="control primary" disabled>▶</button><button class="control" disabled>⏭</button></div></div><div class="lyric-card"><div class="top"><span>歌词</span><button id="manualLyric" class="btn small">手动歌词</button></div><div id="lyrics" class="empty">当前没有歌词</div></div><div class="card"><div class="top"><span>当前歌曲</span><span id="ctx" class="muted">正在识别当前聊天</span></div><div class="actions"><button id="inviteCurrent" class="btn primary">🎵 邀请一起听</button><button id="goSearch" class="btn">⌕ 去找歌</button></div></div></section>
<section class="page" data-page="search"><div class="card"><div class="top"><span>找歌</span><span class="muted">视觉页搜索</span></div><div class="searchbar"><input id="query" placeholder="歌曲、歌手或专辑"><button id="search" class="btn primary">找</button></div><div class="notice">搜索使用橘岛同步 fetch。失败会显示真实错误。</div><div id="results" class="empty">输入关键词开始搜索</div></div><div class="card"><div class="top"><span>歌曲 ID 直达</span></div><input id="manualId" class="field" inputmode="numeric" placeholder="例如 28029095"><div class="actions" style="margin-top:10px"><button id="openManual" class="btn primary">打开网易云</button><button id="inviteManual" class="btn">准备邀请</button></div></div></section>
<section class="page" data-page="together"><div class="card"><div class="top"><span>一起听</span><span class="muted">当前对话分享</span></div><div id="inviteSong" class="song-title" style="font-size:20px">还没有准备歌曲</div><div id="inviteText" class="notice" style="white-space:pre-wrap;margin-top:12px">邀请文案会显示在这里。</div><div class="actions"><button id="sendInvite" class="btn primary">发送到当前聊天</button><button id="copyInvite" class="btn">复制文案</button><a id="openInvite" class="btn" href="#">打开网易云</a></div></div><div class="card"><div class="top"><span>和家机聊这首歌</span></div><div class="chat"><input id="chat" class="field" placeholder="比如：你最喜欢哪一句？"><button id="sendChat" class="btn primary">发送</button></div></div></section><section class="page" data-page="favorites"><div class="card"><div class="top"><span>收藏曲库</span></div><div id="fav" class="empty">还没有收藏歌曲</div></div></section></div><nav class="bottom"><button class="active" data-page="vinyl"><i>◉</i>黑胶</button><button data-page="search"><i>⌕</i>找歌</button><button data-page="together"><i>♡</i>一起听</button><button data-page="favorites"><i>♫</i>收藏</button></nav><div id="modal" class="modal"><div class="modal-box"><div class="top"><b>手动歌词</b><button id="close" class="btn small">关闭</button></div><textarea id="lyricInput" rows="12" placeholder="[00:12.00]第一句歌词"></textarea><div class="actions" style="margin-top:10px"><button id="saveLyric" class="btn primary">保存</button></div></div></div>
<script>
window.onerror=function(msg,url,line,col,err){alert("JS ERROR:\n"+msg+"\nline:"+line+"\ncol:"+col+"\nstack:"+(err&&err.stack?err.stack.slice(0,300):"none"));return false;};
var PACKAGE="com.netease.cloudmusic",media=null,ctx=null,prepared=null,favs=[],currentLyrics="";
function host(){try{if(typeof orangeisland!=="undefined"&&orangeisland)return orangeisland}catch(e){}return null}function cfg(){var h=host();try{if(h&&h.config)return typeof h.config==="string"?JSON.parse(h.config):h.config}catch(e){}return{}}function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}function toast(v){alert(v)}function callTool(n,a,d){var h=host();if(!h||typeof h.call!=="function"){d({ok:false,message:"插件桥不可用"});return}try{h.call(n,a||{},function(r){try{d(typeof r==="string"?JSON.parse(r):r)}catch(e){d({ok:false,message:"工具返回无效"})}})}catch(e){d({ok:false,message:String(e)})}}function page(p){document.querySelectorAll(".page").forEach(function(x){x.classList.toggle("active",x.getAttribute("data-page")===p)});document.querySelectorAll(".bottom button").forEach(function(x){x.classList.toggle("active",x.getAttribute("data-page")===p)})}function time(v){v=Math.max(0,Math.floor(Number(v||0)/1000));return Math.floor(v/60)+":"+String(v%60).padStart(2,"0")}function setImg(i,u){i.onerror=function(){i.removeAttribute("src")};if(u)i.src=String(u).replace(/^http:\/\//i,"https://")}function refresh(){var h=host();if(!h||typeof h.getMediaInfo!=="function"){show({error:true,message:"宿主没有 getMediaInfo"});return}try{var x=h.getMediaInfo(PACKAGE);show(typeof x==="string"?JSON.parse(x):x)}catch(e){show({error:true,message:String(e)})}}function show(x){media=x||{};if(x.error){title.textContent="还没有读取到歌曲";artist.textContent="先在网易云播放一首歌吧";state.textContent=x.message||x.error;permission.textContent="请到橘岛设置中开启音乐控制并授予通知访问权限";permission.classList.toggle("hidden",x.error!=="permission_denied");return}permission.classList.add("hidden");title.textContent=x.title||"未命名歌曲";artist.textContent=[x.artist,x.album].filter(Boolean).join(" · ")||"未知艺术家";state.textContent=(x.isPlaying?"播放中":"已暂停")+" · "+time(x.positionMs)+" / "+time(x.durationMs);progress.max=Math.max(1,x.durationMs||1);progress.value=x.positionMs||0;pos.textContent=time(x.positionMs);dur.textContent=time(x.durationMs);setImg(cover,x.coverUrl);if(x.mediaId)loadLyric(x.mediaId)}function loadLyric(id){if(id===loadLyric.id)return;loadLyric.id=id;callTool("get_song_lyrics",{song_id:String(id)},function(r){if(r&&r.ok){currentLyrics=r.lyric;lyrics.textContent=r.lyric}else lyrics.textContent=(r&&r.message)||"歌词不可用"})}function searchNow(){var k=query.value.trim();if(!k)return;results.textContent="搜索中…";callTool("search_songs",{keyword:k,limit:10},function(r){if(!r||!r.ok){results.innerHTML='<div class="errorbox">'+esc((r&&r.errorCode)||"SEARCH_FAILED")+"："+esc((r&&r.message)||"搜索失败")+'</div>';return}if(!r.songs||!r.songs.length){results.textContent="搜索成功，但没有歌曲";return}results.innerHTML=r.songs.map(function(s,i){return'<div class="result"><img class="thumb" data-i="'+i+'"><div class="result-main"><div class="name">'+esc(s.name)+'</div><div class="meta">'+esc(s.artist)+(s.album?" · "+esc(s.album):"")+'</div><div class="result-buttons"><button class="btn small primary" data-open="'+i+'">打开网易云</button><button class="btn small" data-invite="'+i+'">邀请</button></div></div></div>'}).join("");results.querySelectorAll("[data-i]").forEach(function(i){setImg(i,r.songs[Number(i.getAttribute("data-i"))].coverUrl)});results.querySelectorAll("[data-open]").forEach(function(b){b.onclick=function(){openSong(r.songs[Number(b.getAttribute("data-open"))])}});results.querySelectorAll("[data-invite]").forEach(function(b){b.onclick=function(){invite(r.songs[Number(b.getAttribute("data-invite"))])}})})}function openSong(s){if(!s||!/^[0-9]+$/.test(String(s.id))){toast("歌曲 ID 无效");return}window.location.href="orpheus://song/"+encodeURIComponent(s.id)}function invite(s){callTool("prepare_listen_invite",{song_id:String(s.id),song_name:s.name,artist:s.artist,cover_url:s.coverUrl},function(r){if(!r||!r.ok){toast((r&&r.message)||"邀请失败");return}prepared=r;inviteSong.textContent=r.song.name;inviteText.textContent=r.inviteText;openInvite.href=r.neteaseDeepLink;page("together")})}function sendMsg(v,d){var h=host(),c=cfg(),id=c.windowId||ctx&&ctx.conversationId;if(!id&&h&&typeof h.currentConversationId==="string")id=h.currentConversationId;var dbg="windowId=["+c.windowId+"] ctx.conv=["+(ctx&&ctx.conversationId)+"] host.cur=["+(h&&h.currentConversationId)+"] resolved=["+id+"] hasHost="+(!!h)+" hasSend="+(h&&typeof h.sendChatMessage==="function");if(!id||!h||typeof h.sendChatMessage!=="function"){alert("SEND FAIL DIAG:\n"+dbg+"\n-> no valid conversation id or bridge unavailable");d(false,"bridge unavailable");return}try{var r=h.sendChatMessage.length<=1?h.sendChatMessage(v):h.sendChatMessage(id,v);if(r&&r.then)r.then(function(x){alert("SEND RESULT(then):"+x+"\n"+dbg);d(x!==false,"")}).catch(function(e){alert("SEND ERR(catch):"+e+"\n"+dbg);d(false,String(e))});else{alert("SEND RESULT(sync):"+r+"\n"+dbg);d(r!==false,"")}}catch(e){alert("SEND ERR(try):"+e+"\n"+dbg);d(false,String(e))}}function current(){return media&&!media.error?{id:String(media.mediaId||""),name:media.title,artist:media.artist}:null}
navFix();function navFix(){document.querySelectorAll(".bottom button").forEach(function(b){b.onclick=function(){page(b.getAttribute("data-page"))}})}refresh();setInterval(refresh,1500);var ai=cfg().ai_name||"林默";var elBrand=document.getElementById("brand");if(elBrand)elBrand.textContent="🎧 "+ai+"的黑胶";var elRefresh=document.getElementById("refresh");if(elRefresh)elRefresh.onclick=refresh;var elGoSearch=document.getElementById("goSearch");if(elGoSearch)elGoSearch.onclick=function(){page("search")};var elSearch=document.getElementById("search");if(elSearch)elSearch.onclick=searchNow;var elQuery=document.getElementById("query");if(elQuery)elQuery.onkeydown=function(e){if(e.key==="Enter")searchNow()};var elManualOpen=document.getElementById("manualOpen");if(elManualOpen)elManualOpen.onclick=function(){var id=document.getElementById("manualId").value.trim();if(/^\d+$/.test(id))openSong({id:id})};var elManualInvite=document.getElementById("manualInvite");if(elManualInvite)elManualInvite.onclick=function(){var id=document.getElementById("manualId").value.trim();if(/^\d+$/.test(id))invite({id:id,name:"网易云歌曲 "+id,artist:""})};var elSendInvite=document.getElementById("sendInvite");if(elSendInvite){elSendInvite.onclick=function(){if(!prepared){alert("No invite prepared. Go to Search tab, click Invite on a song first.");return}sendMsg(prepared.inviteText,function(ok,e){alert("sendMsg callback: ok="+ok+" err="+e)})}}else{alert("FATAL: sendInvite button not found in DOM")}var elCopyInvite=document.getElementById("copyInvite");if(elCopyInvite)elCopyInvite.onclick=function(){if(prepared&&navigator.clipboard)navigator.clipboard.writeText(prepared.inviteText)};var elSendChat=document.getElementById("sendChat");if(elSendChat)elSendChat.onclick=function(){var v=document.getElementById("chat").value.trim();if(v)sendMsg(v,function(ok,e){toast(ok?"已发送":e)})};var elManualLyric=document.getElementById("manualLyric");if(elManualLyric)elManualLyric.onclick=function(){var li=document.getElementById("lyricInput");if(li)li.value=currentLyrics;var m=document.getElementById("modal");if(m)m.classList.add("show")};var elClose=document.getElementById("close");if(elClose)elClose.onclick=function(){var m=document.getElementById("modal");if(m)m.classList.remove("show")};var elSaveLyric=document.getElementById("saveLyric");if(elSaveLyric)elSaveLyric.onclick=function(){var li=document.getElementById("lyricInput");if(li)currentLyrics=li.value;var ly=document.getElementById("lyrics");if(ly)ly.textContent=currentLyrics;var m=document.getElementById("modal");if(m)m.classList.remove("show")};callTool("get_plugin_context",{},function(r){ctx=r&&r.ok?r:null;var elCtx=document.getElementById("ctx");if(elCtx)elCtx.textContent=ctx&&ctx.conversationId?"已连接当前聊天":"未识别到当前聊天"});
</script></body></html>
