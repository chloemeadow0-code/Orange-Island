<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AI小窝</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #fff5e6 0%, #ffe8d6 50%, #ffd6c0 100%);
      background-attachment: fixed;
      color: #5a3e2b;
      overflow-x: hidden;
      /* 底部留出导航栏+安全区高度 */
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
    }

    /* ===== 加载/错误状态 ===== */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      gap: 12px;
      color: #b8835a;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #f0d0a0;
      border-top-color: #d4885a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #errorBox {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      gap: 12px;
      color: #c05050;
      text-align: center;
      padding: 20px;
    }

    #app { display: none; }

    /* ===== 顶部状态栏（贴合屏幕顶部，含刘海安全区） ===== */
    .status-bar {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(10px);
      border-radius: 0 0 20px 20px;
      /* 顶部padding加安全区，覆盖刘海 */
      padding: calc(14px + env(safe-area-inset-top)) 16px 14px;
      box-shadow: 0 2px 12px rgba(180,120,80,0.15);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .status-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .home-title {
      font-size: 18px;
      font-weight: 700;
      color: #7a5230;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .weather-badge {
      font-size: 13px;
      color: #a07850;
      background: rgba(255,255,255,0.6);
      padding: 3px 10px;
      border-radius: 12px;
    }
    .status-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .status-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
    }
    .status-label {
      display: flex;
      align-items: center;
      gap: 2px;
      color: #8a6240;
      min-width: 42px;
    }
    .status-bar-bg {
      flex: 1;
      height: 6px;
      background: #f0e0d0;
      border-radius: 3px;
      overflow: hidden;
    }
    .status-bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.5s ease;
    }
    .status-value {
      font-size: 11px;
      color: #a07850;
      min-width: 24px;
      text-align: right;
    }
    .wallet-display {
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
    }
    .wallet-item { color: #8a6240; }
    .wallet-item span { font-weight: 700; color: #d4885a; }

    /* ===== AI 当前状态卡片 ===== */
    .ai-card {
      margin: 12px;
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 10px rgba(180,120,80,0.1);
    }
    .ai-avatar {
      width: 50px; height: 50px;
      background: linear-gradient(135deg, #ffd6c0, #ffb088);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
      animation: bob 3s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .ai-info { flex: 1; }
    .ai-activity {
      font-size: 14px;
      font-weight: 600;
      color: #7a5230;
    }
    .ai-location {
      font-size: 12px;
      color: #a07850;
      margin-top: 2px;
    }
    .ai-mood-emoji { font-size: 20px; }

    /* ===== 主内容区 ===== */
    .main-content {
      padding: 0 12px;
    }
    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: #7a5230;
      margin: 16px 0 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ===== 房间视图 ===== */
    .room-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 12px;
      -webkit-overflow-scrolling: touch;
    }
    .room-tabs::-webkit-scrollbar { height: 3px; }
    .room-tabs::-webkit-scrollbar-thumb { background: #e0c0a0; border-radius: 2px; }
    .room-tab {
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 13px;
      white-space: nowrap;
      cursor: pointer;
      background: rgba(255,255,255,0.6);
      color: #a07850;
      border: 1px solid transparent;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .room-tab.active {
      background: linear-gradient(135deg, #ffb088, #d4885a);
      color: white;
      border-color: #d4885a;
      box-shadow: 0 2px 8px rgba(212,136,90,0.3);
    }
    .room-tab.locked {
      opacity: 0.4;
    }

    .room-view {
      background: rgba(255,255,255,0.7);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(180,120,80,0.08);
    }
    .room-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .room-name { font-size: 15px; font-weight: 700; color: #7a5230; }
    .room-coziness {
      font-size: 12px;
      color: #d4885a;
      background: rgba(255,200,160,0.3);
      padding: 3px 10px;
      border-radius: 10px;
    }
    .room-decor {
      display: flex;
      gap: 8px;
      font-size: 11px;
      color: #a07850;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .decor-tag {
      background: rgba(255,255,255,0.5);
      padding: 2px 8px;
      border-radius: 8px;
    }
    .furniture-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      min-height: 120px;
    }
    .furniture-cell {
      aspect-ratio: 1;
      background: rgba(255,250,240,0.6);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      position: relative;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .furniture-cell:active { transform: scale(0.95); }
    .furniture-name {
      font-size: 9px;
      color: #8a6240;
      margin-top: 2px;
      text-align: center;
      line-height: 1.1;
    }
    .furniture-cell.ai-here {
      background: linear-gradient(135deg, #ffe8d0, #ffd0a8);
      box-shadow: 0 0 12px rgba(255,160,100,0.3);
    }
    .ai-marker {
      position: absolute;
      top: -4px;
      right: -4px;
      font-size: 14px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
    .empty-room {
      grid-column: 1 / -1;
      text-align: center;
      padding: 30px 0;
      color: #c0a080;
      font-size: 13px;
    }

    /* ===== 城市视图 ===== */
    .city-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .place-card {
      background: rgba(255,255,255,0.75);
      border-radius: 14px;
      padding: 12px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(180,120,80,0.08);
      position: relative;
    }
    .place-card.locked {
      opacity: 0.5;
      filter: grayscale(0.5);
    }
    .place-card.visited::after {
      content: '📍';
      position: absolute;
      top: 6px;
      right: 8px;
      font-size: 12px;
    }
    .place-emoji { font-size: 32px; margin-bottom: 4px; }
    .place-name { font-size: 13px; font-weight: 600; color: #7a5230; }
    .place-note { font-size: 10px; color: #a07850; margin-top: 2px; line-height: 1.3; }
    .place-price {
      font-size: 11px;
      color: #d4885a;
      margin-top: 4px;
      font-weight: 600;
    }

    /* ===== 便签视图 ===== */
    .note-card {
      background: rgba(255,255,240,0.9);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(180,120,80,0.1);
      position: relative;
      border-left: 3px solid #ffc080;
    }
    .note-card.favorited {
      border-left-color: #ff8080;
      background: rgba(255,245,240,0.95);
    }
    .note-card.newest {
      box-shadow: 0 2px 12px rgba(255,160,100,0.25);
      border-left-color: #d4885a;
    }
    .note-content {
      font-size: 14px;
      color: #5a3e2b;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .note-time {
      font-size: 11px;
      color: #b89870;
      margin-top: 6px;
    }
    .note-fav-icon {
      position: absolute;
      top: 10px;
      right: 12px;
      font-size: 14px;
    }
    .empty-list {
      text-align: center;
      padding: 40px 20px;
      color: #c0a080;
      font-size: 14px;
    }

    /* ===== 照片视图 ===== */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .photo-item {
      aspect-ratio: 1;
      background: linear-gradient(135deg, #fff8f0, #ffe8d0);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px;
      box-shadow: 0 2px 6px rgba(180,120,80,0.1);
      text-align: center;
    }
    .photo-emoji { font-size: 28px; }
    .photo-scene {
      font-size: 9px;
      color: #8a6240;
      margin-top: 2px;
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .photo-time {
      font-size: 8px;
      color: #b89870;
      margin-top: 2px;
    }

    /* ===== 成就视图 ===== */
    .achievement-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .achievement-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.75);
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 2px 6px rgba(180,120,80,0.08);
    }
    .achievement-card.locked {
      opacity: 0.4;
      filter: grayscale(1);
    }
    .achievement-emoji { font-size: 28px; flex-shrink: 0; }
    .achievement-info { flex: 1; }
    .achievement-name { font-size: 14px; font-weight: 600; color: #7a5230; }
    .achievement-desc { font-size: 11px; color: #a07850; margin-top: 2px; }
    .achievement-time { font-size: 10px; color: #d4885a; margin-top: 2px; }

    /* ===== 底部导航（贴合屏幕底部+左右边缘，含Home条安全区） ===== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(12px);
      border-radius: 20px 20px 0 0;
      display: flex;
      justify-content: space-around;
      padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
      box-shadow: 0 -2px 16px rgba(180,120,80,0.15);
      z-index: 100;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 4px 12px;
      cursor: pointer;
      color: #b89870;
      font-size: 10px;
      transition: all 0.2s;
      border-radius: 10px;
    }
    .nav-item.active {
      color: #d4885a;
      background: rgba(255,200,160,0.2);
    }
    .nav-icon { font-size: 20px; }

    /* ===== 视图切换 ===== */
    .view { display: none; }
    .view.active { display: block; }

    /* ===== 提示气泡 ===== */
    .toast {
      position: fixed;
      bottom: calc(90px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(90,62,43,0.9);
      color: white;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 13px;
      opacity: 0;
      transition: all 0.3s;
      z-index: 200;
      pointer-events: none;
      white-space: nowrap;
      max-width: 90vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ===== 触发提示 ===== */
    .trigger-badge {
      display: inline-block;
      background: #ff7060;
      color: white;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 10px;
      margin-left: 6px;
      animation: pulse 1.5s ease-in-out infinite;
    }
  </style>
</head>
<body>

<!-- 加载中 -->
<div id="loading">
  <div class="spinner"></div>
  <div>正在回家... 🏠</div>
</div>

<!-- 错误提示 -->
<div id="errorBox">
  <div style="font-size:40px;">😕</div>
  <div id="errorMsg">出错了</div>
  <div style="font-size:12px;color:#a07850;">请检查网络和配置</div>
</div>

<!-- 主应用 -->
<div id="app">
  <!-- 顶部状态栏 -->
  <div class="status-bar">
    <div class="status-header">
      <div class="home-title">🏠 AI小窝</div>
      <div class="weather-badge" id="weatherBadge">--</div>
    </div>
    <div class="status-grid" id="statusGrid"></div>
    <div class="wallet-display">
      <div class="wallet-item">💰 金币 <span id="coinsDisplay">0</span></div>
      <div class="wallet-item">👛 AI钱包 <span id="walletDisplay">0</span></div>
      <div class="wallet-item">🏡 温馨 <span id="cozinessDisplay">0</span></div>
    </div>
  </div>

  <!-- AI当前状态卡片 -->
  <div class="ai-card">
    <div class="ai-avatar" id="aiAvatar">🧸</div>
    <div class="ai-info">
      <div class="ai-activity" id="aiActivity">在家</div>
      <div class="ai-location" id="aiLocation">客厅</div>
    </div>
    <div class="ai-mood-emoji" id="aiMoodEmoji">😊</div>
  </div>

  <!-- 主内容区 -->
  <div class="main-content">

    <!-- 房间视图 -->
    <div class="view active" id="view-rooms">
      <div class="section-title">🏠 我的家</div>
      <div class="room-tabs" id="roomTabs"></div>
      <div class="room-view" id="roomView"></div>
    </div>

    <!-- 城市视图 -->
    <div class="view" id="view-city">
      <div class="section-title">🌆 小城市</div>
      <div class="city-grid" id="cityGrid"></div>
    </div>

    <!-- 便签视图 -->
    <div class="view" id="view-notes">
      <div class="section-title">
        📝 便签
        <span id="noteTriggerBadge" style="display:none;" class="trigger-badge">AI想写便签</span>
      </div>
      <div id="notesList"></div>
    </div>

    <!-- 照片视图 -->
    <div class="view" id="view-photos">
      <div class="section-title">📸 照片墙</div>
      <div class="photo-grid" id="photoGrid"></div>
    </div>

    <!-- 成就视图 -->
    <div class="view" id="view-achievements">
      <div class="section-title">🏆 成就</div>
      <div class="achievement-list" id="achievementList"></div>
    </div>

  </div>
</div>

<!-- 底部导航 -->
<div class="bottom-nav" id="bottomNav" style="display:none;">
  <div class="nav-item active" data-view="rooms">
    <div class="nav-icon">🏠</div>
    <div>房间</div>
  </div>
  <div class="nav-item" data-view="city">
    <div class="nav-icon">🌆</div>
    <div>城市</div>
  </div>
  <div class="nav-item" data-view="notes">
    <div class="nav-icon">📝</div>
    <div>便签</div>
  </div>
  <div class="nav-item" data-view="photos">
    <div class="nav-icon">📸</div>
    <div>照片</div>
  </div>
  <div class="nav-item" data-view="achievements">
    <div class="nav-icon">🏆</div>
    <div>成就</div>
  </div>
</div>

<!-- 提示气泡 -->
<div class="toast" id="toast"></div>

// ====== 全局状态 ======
let homeData = null;
let currentRoom = '客厅';
let homeId = '';
let refreshTimer = null;

// ====== Bridge 初始化 ======
let attempts = 0;
function waitForBridge() {
  attempts++;
  if (typeof Bridge !== 'undefined' && Bridge.getPluginConfig) {
    init();
  } else if (attempts < 80) {
    setTimeout(waitForBridge, 50);
  } else {
    // Bridge 不可用时也可以手动输入 home_id 测试
    init();
  }
}

async function init() {
  try {
    if (typeof Bridge !== 'undefined' && Bridge.getPluginConfig) {
      const raw = await Bridge.getPluginConfig();
      const cfg = typeof raw === 'string' ? JSON.parse(raw) : raw;
      homeId = cfg.home_id || '';
    }
  } catch(e) {
    // 忽略错误
  }

  if (!homeId) {
    showError('未配置小窝门牌号（home_id），请在插件设置中填写');
    return;
  }

  await fetchData();
  startAutoRefresh();
}

// ====== 数据获取 ======
async function fetchData() {
  try {
    const url = SUPABASE_URL + '/rest/v1/' + TABLE_NAME + '?home_id=eq.' + encodeURIComponent(homeId);
    const res = await fetch(url, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY
      }
    });
    if (!res.ok) throw new Error('网络错误: ' + res.status);
    const json = await res.json();
    if (!json || json.length === 0) {
      showError('小窝数据不存在，请先在对话中让AI初始化小窝');
      return;
    }
    homeData = json[0].data;
    showApp();
    renderAll();
  } catch(e) {
    showError(e.message || '获取数据失败');
  }
}

function startAutoRefresh() {
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(fetchData, 30000); // 每30秒刷新
}

// ====== 显示控制 ======
function showApp() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('errorBox').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('bottomNav').style.display = 'flex';
}

function showError(msg) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('errorMsg').textContent = msg;
  document.getElementById('errorBox').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.getElementById('bottomNav').style.display = 'none';
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

function renderStatusBar() {

function getWeatherEmoji(w) {
  const map = { '晴': '☀️', '多云': '⛅', '小雨': '🌦️', '大雨': '🌧️', '雷阵雨': '⛈️', '春雷': '⛈️', '小雪': '🌨️', '大雪': '❄️', '酷热': '🥵', '寒风': '🥶', '秋风': '💨' };
  return map[w] || '🌤️';
}

function getMoodEmoji(mood) {
  if (mood >= 80) return '😄';
  if (mood >= 60) return '😊';
  if (mood >= 40) return '😐';
  if (mood >= 20) return '😔';
  return '😢';
}

  else if (s.current_activity === 'cook') avatar = '👩‍🍳';

  else if (s.current_activity === 'game') avatar = '🎮';

// ====== 房间渲染 ======
function renderRoomTabs() {
  const tabs = document.getElementById('roomTabs');
  tabs.innerHTML = ALL_ROOMS.map(r => {
    const room = homeData.rooms[r];
    if (!room) return '';
    const cls = room.unlocked ? '' : 'locked';
    const active = r === currentRoom ? 'active' : '';
    return `<div class="room-tab ${cls} ${active}" onclick="switchRoom('${r}')">${r}</div>`;
  }).join('');
}

function switchRoom(room) {
  currentRoom = room;
  renderRoomTabs();
  renderRoom();
}

function renderRoom() {
  const room = homeData.rooms[currentRoom];
  const view = document.getElementById('roomView');

  if (!room || !room.unlocked) {
    view.innerHTML = `
      <div class="room-header">
        <div class="room-name">${currentRoom}</div>
      </div>
      <div class="empty-room">🔒 该房间未解锁<br>请让AI帮你解锁</div>
    `;
    return;
  }

  const furniture = room.furniture || [];
  const coziness = getRoomCoziness(currentRoom);
  const isAiHere = homeData.ai_state.current_room === currentRoom;

  let furnitureHtml = '';
  if (furniture.length === 0) {
    furnitureHtml = '<div class="empty-room">这个房间还空空的<br>去让AI买点家具吧~</div>';
  } else {
    furnitureHtml = furniture.map(fid => {
      const f = FURNITURE[fid];
      if (!f) return `<div class="furniture-cell">${fid}</div>`;
      return `<div class="furniture-cell" onclick="showToast('${f.name}')">
        <div>${f.emoji}</div>
        <div class="furniture-name">${f.name}</div>
      </div>`;
    }).join('');
  }

  // 如果AI在这个房间，加一个AI标记格
  if (isAiHere) {
    furnitureHtml += `<div class="furniture-cell ai-here">
      <div id="aiHereAvatar">🧸</div>
      <div class="ai-marker">✨</div>
      <div class="furniture-name">AI在这里</div>
    </div>`;
    // 同步AI头像
    setTimeout(() => {
      const av = document.getElementById('aiHereAvatar');
      if (av) av.textContent = document.getElementById('aiAvatar').textContent;
    }, 0);
  }

  const decorTags = [];
  if (room.wallpaper && room.wallpaper !== '默认') decorTags.push(`🧱 ${room.wallpaper}`);
  if (room.floor && room.floor !== '默认') decorTags.push(`🔲 ${room.floor}`);
  if (room.light && room.light !== '默认') decorTags.push(`💡 ${room.light}`);

  view.innerHTML = `
    <div class="room-header">
      <div class="room-name">${currentRoom} ${isAiHere ? '✨' : ''}</div>
      <div class="room-coziness">🏡 温馨 ${coziness}</div>
    </div>
    ${decorTags.length > 0 ? `<div class="room-decor">${decorTags.map(t => `<span class="decor-tag">${t}</span>`).join('')}</div>` : ''}
    <div class="furniture-grid">${furnitureHtml}</div>
  `;
}

function getRoomCoziness(roomName) {
  const room = homeData.rooms[roomName];
  if (!room || !room.unlocked) return 0;
  let c = 0;
  // 简单计算（与main.js一致）
  for (const fid of (room.furniture || [])) {
    // 这里简化，没有完整的家具数据库，用一个粗略映射
    c += 5;
  }
  if (room.wallpaper && room.wallpaper !== '默认') c += 3;
  if (room.floor && room.floor !== '默认') c += 3;
  if (room.light === '暖黄') c += 5;
  if (room.light === '星空投影') c += 8;
  return c;
}

function getTotalCoziness() {
  let total = 0;
  for (const r of ALL_ROOMS) total += getRoomCoziness(r);
  return total;
}

// ====== 城市渲染 ======
function renderCity() {
  const grid = document.getElementById('cityGrid');
  const visited = homeData.today_visited_places || [];

  grid.innerHTML = Object.keys(CITY_PLACES).map(name => {
    const p = CITY_PLACES[name];
    const d = homeData.city[name] || { unlocked: false };
    const isVisited = visited.includes(name);
    const cls = (d.unlocked ? '' : 'locked') + (isVisited ? ' visited' : '');
    const priceHtml = !d.unlocked && p.buildable ? `<div class="place-price">建造 ${p.price}金</div>` : '';
    return `<div class="place-card ${cls}">
      <div class="place-emoji">${p.emoji}</div>
      <div class="place-name">${name}</div>
      <div class="place-note">${p.note}</div>
      ${priceHtml}
    </div>`;
  }).join('');
}

  const list = document.getElementById('notesList');

    list.innerHTML = '<div class="empty-list">还没有便签~<br>AI想你了就会写的 ✉️</div>';
    return;
  }

  list.innerHTML = notes.slice(0, 50).map((n, i) => {
    const cls = (n.favorited ? 'favorited' : '') + (i === 0 ? ' newest' : '');
    const fav = n.favorited ? '⭐' : '';
    return `<div class="note-card ${cls}">
      ${fav ? `<div class="note-fav-icon">${fav}</div>` : ''}
      <div class="note-content">${escapeHtml(n.content)}</div>
      <div class="note-time">${formatTime(n.time)}</div>

  }).join('');

    const cls = u ? '' : 'locked';

    return `<div class="achievement-card ${cls}">
      <div class="achievement-emoji">${ach.emoji}</div>
      <div class="achievement-info">
        <div class="achievement-name">${ach.name}</div>
        <div class="achievement-desc">${ach.desc}</div>
        ${time}
      </div>
    </div>`;
  }).join('');
}

// ====== 工具函数 ======
function formatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff/60) + '分钟前';
  if (diff < 86400) return Math.floor(diff/3600) + '小时前';
  if (diff < 86400*7) return Math.floor(diff/86400) + '天前';
  return (d.getMonth()+1) + '/' + d.getDate();
}

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ====== 导航切换 ======
document.getElementById('bottomNav').addEventListener('click', (e) => {
  const item = e.target.closest('.nav-item');
  if (!item) return;
  const view = item.dataset.view;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  item.classList.add('active');
  document.getElementById('view-' + view).classList.add('active');
});

// ====== 启动 ======
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', waitForBridge);
} else {
  waitForBridge();
}
