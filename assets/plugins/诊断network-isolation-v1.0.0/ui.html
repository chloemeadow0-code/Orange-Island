<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0910">
<title>网络隔离诊断</title>
<style>
:root{--bg:#0b0910;--panel:#17131f;--line:#33293f;--text:#f8f4fb;--muted:#aaa0b6;--accent:#b987ff;--danger:#ff9bb6;--warn:#ffd5a5;--shadow:0 22px 65px rgba(0,0,0,.46)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{max-width:560px;margin:0 auto;overflow-x:hidden}button,input{font:inherit}button{cursor:pointer}.app{min-height:100vh;padding:18px 18px calc(96px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.brand{font-size:18px;font-weight:800;color:#e4d3ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.refresh{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(23,19,31,.68);color:#d6cce0;font-size:20px}.card{background:rgba(23,19,31,.78);border:1px solid rgba(185,135,255,.2);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--shadow);backdrop-filter:blur(12px)}.card-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px;font-size:13px;color:#bcb0c6}.row{display:flex;gap:8px;flex-wrap:wrap}.searchbar{display:flex;gap:8px}.searchbar input{flex:1;min-width:0;border:1px solid var(--line);border-radius:13px;background:#120e19;color:var(--text);padding:13px 14px;outline:none}.btn{min-height:42px;border-radius:13px;border:1px solid var(--line);background:#241c2e;color:var(--text);padding:0 14px}.btn.primary{background:linear-gradient(135deg,#bf91ff,#a875f2);border-color:transparent;color:#1d1127;font-weight:800}.btn.small{min-height:34px;border-radius:10px;font-size:12px;padding:0 10px}.notice,.errorbox,.successbox{padding:13px 14px;border-radius:14px;font-size:13px;line-height:1.65;white-space:pre-wrap;word-break:break-word}.notice{background:rgba(89,62,32,.42);color:var(--warn)}.errorbox{background:rgba(91,37,52,.58);color:#ffc0cf}.successbox{background:rgba(36,60,44,.56);color:#cbf2d8}.probe{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08)}.probe strong{display:block;margin-bottom:4px}.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid .full{grid-column:1/-1}.label{font-size:12px;color:var(--muted);margin:10px 2px 6px}.field{width:100%;border:1px solid var(--line);border-radius:13px;background:#120e19;color:var(--text);padding:13px 14px;outline:none}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);display:grid;grid-template-columns:repeat(2,1fr);background:rgba(14,10,19,.96);border-top:1px solid var(--line);padding:10px 6px calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(18px)}.nav button{border:0;background:transparent;color:var(--muted);font-size:12px;padding:5px}.nav button.active{color:var(--accent)}.navicon{display:block;font-size:23px;margin-bottom:4px}.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:10;background:#2c2138;border:1px solid #604b78;color:#f8f1ff;padding:10px 14px;border-radius:13px;max-width:88%;text-align:center;font-size:13px;display:none;box-shadow:0 12px 34px rgba(0,0,0,.35)}.empty{padding:22px 10px;text-align:center;color:var(--muted);line-height:1.75}.okdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#65e0a3;margin-right:6px}.baddot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ff8da1;margin-right:6px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div id="brand" class="brand">🧷 网络隔离诊断</div><button id="refresh" class="refresh" aria-label="刷新">↻</button></header>

  <section id="page-main" class="page active">
    <div class="card">
      <div class="card-head"><span>主机 fetch 诊断</span><span>main.js</span></div>
      <div class="notice">这部分测的是橘子岛插件主机里的同步 fetch，不碰搜索结果、deeplink 或播放控制。</div>
      <div class="row" style="margin-top:12px"><button id="runMain" class="btn primary">运行 main.js 测试</button></div>
      <div id="mainResult" style="margin-top:12px"><div class="empty">点击按钮开始</div></div>
    </div>
  </section>

  <section id="page-ui" class="page">
    <div class="card">
      <div class="card-head"><span>浏览器网络诊断</span><span>ui.html</span></div>
      <div class="notice">这部分只测 WebView 自己能不能把请求发出去。使用 `mode: no-cors`，不读响应体，只看请求能不能完成。</div>
      <div class="row" style="margin-top:12px"><button id="runUi" class="btn primary">运行 UI 测试</button></div>
      <div id="uiResult" style="margin-top:12px"><div class="empty">点击按钮开始</div></div>
    </div>
  </section>
</div>

<nav class="nav">
  <button data-target="main" class="active"><span class="navicon">🧷</span>主机</button>
  <button data-target="ui"><span class="navicon">🌐</span>浏览器</button>
</nav>
<div id="toast" class="toast"></div>

<script>
var EXAMPLE = "https://example.com/";
var NETEASE_HOME = "https://music.163.com/";
var NETEASE_SEARCH = "https://music.163.com/api/search/get?s=%E7%88%B1%E7%88%B1%E7%88%B1&type=1&limit=1&offset=0";

function host(){try{if(typeof orangeisland!=="undefined"&&orangeisland)return orangeisland}catch(e){}try{if(typeof agora!=="undefined"&&agora)return agora}catch(e){}return null}
function esc(v){return String(v==null?"":v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function toast(message){var el=document.getElementById('toast');el.textContent=message;el.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(function(){el.style.display='none'},3400)}
function setPage(page){document.querySelectorAll('.page').forEach(function(el){el.classList.toggle('active',el.id==='page-'+page)});document.querySelectorAll('.nav button').forEach(function(el){el.classList.toggle('active',el.getAttribute('data-target')===page)})}
function readConfig(){var h=host();try{if(h&&h.config)return typeof h.config==='string'?JSON.parse(h.config):h.config}catch(e){}try{if(typeof __OI_PLUGIN_CONFIG!=='undefined'&&__OI_PLUGIN_CONFIG)return typeof __OI_PLUGIN_CONFIG==='string'?JSON.parse(__OI_PLUGIN_CONFIG):__OI_PLUGIN_CONFIG}catch(e){}return{}}
function updateBrand(){var cfg=readConfig()||{};var ai=String(cfg.ai_name||'林默').trim()||'林默';var user=String(cfg.user_name||'晓晓').trim()||'晓晓';document.getElementById('brand').textContent='🧷 '+ai+' · '+user+' 隔离诊断'}
function callTool(name,args,done){var h=host();if(!h||typeof h.call!=='function'){done({ok:false,errorCode:'BRIDGE_MISSING',message:'请从插件列表的🌐图标打开'});return}try{h.call(name,args||{},function(raw){var result;try{result=typeof raw==='string'?JSON.parse(raw):raw}catch(e){result={ok:false,errorCode:'INVALID_RESULT',message:'工具返回不是 JSON'}}done(result||{ok:false,errorCode:'EMPTY_RESULT',message:'工具没有返回结果'})})}catch(e){done({ok:false,errorCode:'CALL_FAILED',message:String(e&&e.message||e)})}}
function renderProbe(p){var ok=p.ok===true;return '<div class="probe '+(ok?'successbox':'errorbox')+'"><strong>'+(ok?'<span class="okdot"></span>':'<span class="baddot"></span>')+esc(p.name)+'</strong>HTTP：'+esc(p.httpStatus||0)+'\nURL：'+esc(p.requestUrl||'')+'\n错误：'+esc(p.errorCode||'')+'\n信息：'+esc(p.message||'')+'\n响应摘要：'+esc(p.rawSummary||'')+'\n长度：'+esc(p.bodyLength||0)+'\n模式：'+esc(p.mode||'')+'<div class="mono" style="margin-top:8px">responseKeys: '+esc((p.responseKeys&&p.responseKeys.length)?p.responseKeys.join(', '):'[]')+'</div></div>'}
function renderMain(result){var box=document.getElementById('mainResult');if(!result||result.ok!==true){box.innerHTML='<div class="errorbox">main.js 诊断失败\n'+esc((result&&result.message)||'没有结果')+'</div>';return}var html='<div class="notice">结论：'+esc(result.conclusion||'')+'</div>';html+=result.probes.map(renderProbe).join('');box.innerHTML=html}
function runMain(){callTool('diagnose_main_fetch',{},function(result){if(!result||result.ok!==true){document.getElementById('mainResult').innerHTML='<div class="errorbox">工具失败\n'+esc((result&&result.errorCode)||'DIAG_FAILED')+'\n'+esc((result&&result.message)||'')+'</div>';return}renderMain(result)})}
function probeNoCors(url, name){return fetch(url,{method:'GET',mode:'no-cors',cache:'no-store'}).then(function(resp){return{name:name,ok:true,url:url,type:resp.type||'',status:resp.status||0}}).catch(function(err){return{name:name,ok:false,url:url,error:String(err&&err.message||err)}})}
function renderUi(results){var box=document.getElementById('uiResult');var conclusion='';var ex=results.find(function(x){return x.name==='example_no_cors'});var home=results.find(function(x){return x.name==='music_home_no_cors'});var search=results.find(function(x){return x.name==='music_search_no_cors'});if(ex&&ex.ok===false){conclusion='WebView 自己连 example.com 都失败，优先查设备网络或 WebView 网络策略';}else if(ex&&ex.ok&&home&&home.ok&&search&&search.ok){conclusion='UI 网络是通的；如果 main.js 还失败，问题更像宿主 fetch 桥';}else if(home&&home.ok===false){conclusion='WebView 能不能连网易云首页还要看失败详情';}else{conclusion='看下面每个 no-cors probe 的结果';}
var html='<div class="notice">结论：'+esc(conclusion)+'</div>';html+=results.map(function(p){return '<div class="'+(p.ok?'successbox':'errorbox')+'"><strong>'+(p.ok?'<span class="okdot"></span>':'<span class="baddot"></span>')+esc(p.name)+'</strong>\n'+(p.ok?'已完成':'失败')+'\nURL：'+esc(p.url)+'\n类型：'+esc(p.type||'')+'\n状态：'+esc(p.status||0)+'\n错误：'+esc(p.error||'')+'</div>'}).join('');box.innerHTML=html}
async function runUi(){var results=[];results.push(await probeNoCors(EXAMPLE,'example_no_cors'));results.push(await probeNoCors(NETEASE_HOME,'music_home_no_cors'));results.push(await probeNoCors(NETEASE_SEARCH,'music_search_no_cors'));renderUi(results)}

document.querySelectorAll('.nav button').forEach(function(btn){btn.onclick=function(){setPage(btn.getAttribute('data-target'))}});document.getElementById('runMain').onclick=runMain;document.getElementById('runUi').onclick=runUi;document.getElementById('refresh').onclick=function(){if(document.getElementById('page-main').classList.contains('active'))runMain();else runUi()};updateBrand();
</script>
</body>
</html>
