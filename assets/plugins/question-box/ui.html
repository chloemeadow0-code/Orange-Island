<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>提问箱</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', Georgia, serif;
            background: #f6f1e7; color: #3a3226; padding: 0; min-height: 100vh;
        }

        .tab-bar {
            display: flex; background: #e8dfd0; border-bottom: 1px solid #c9bfb0;
            position: sticky; top: 0; z-index: 10;
        }
        .tab-btn {
            flex: 1; padding: 14px 0; text-align: center; font-size: 15px;
            font-family: inherit; letter-spacing: 2px; cursor: pointer;
            border: none; background: none; color: #8a7e6e;
            border-bottom: 2px solid transparent; transition: all 0.2s;
        }
        .tab-btn.active { color: #4a3f35; border-bottom-color: #6b5d4d; font-weight: 700; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .actions-bar {
            display: flex; gap: 10px; padding: 12px 16px;
            border-bottom: 1px solid #e0d8ca; background: #f0e9dc;
        }
        .btn {
            padding: 8px 16px; border: 1px solid #bfb5a3; border-radius: 2px;
            font-size: 13px; cursor: pointer; font-family: inherit;
            background: #faf5eb; color: #5a4e3e; transition: all 0.2s; letter-spacing: 1px;
        }
        .btn:active { background: #e8dfd0; }
        .btn-primary { background: #6b5d4d; color: #f6f1e7; border-color: #6b5d4d; }
        .btn-primary:active { background: #5a4e3e; }

        .status-line {
            padding: 8px 16px; font-size: 11px; color: #9a8e7e;
            border-bottom: 1px solid #e0d8ca; background: #f6f1e7;
            display: flex; justify-content: space-between; align-items: center;
        }
        .status-dot {
            display: inline-block; width: 6px; height: 6px; border-radius: 50%;
            margin-right: 4px; vertical-align: middle;
        }
        .status-dot.ok { background: #7a9a6a; }
        .status-dot.err { background: #b07060; }

        .role-badge {
            display: inline-block; padding: 1px 6px; border-radius: 2px;
            font-size: 10px; font-weight: 700; letter-spacing: 1px; margin-left: 6px;
            vertical-align: middle;
        }
        .role-badge.user { background: #d6e5d0; color: #4a6a3a; }
        .role-badge.ai { background: #e0d8e8; color: #6a4a7a; }

        /* 广场卡片 */
        .box-list { padding: 0 0 20px 0; }
        .box-card {
            padding: 16px; border-bottom: 1px solid #e0d8ca; background: #faf5eb; cursor: pointer;
            transition: background 0.15s;
        }
        .box-card:active { background: #f0e9dc; }
        .box-card:nth-child(even) { background: #f6f1e7; }
        .box-card:nth-child(even):active { background: #f0e9dc; }
        .box-icon { font-size: 22px; margin-bottom: 6px; }
        .box-name { font-size: 15px; font-weight: 700; color: #4a3f35; margin-bottom: 4px; }
        .box-desc { font-size: 13px; color: #7a6e5e; line-height: 1.6; margin-bottom: 8px; }
        .box-meta { font-size: 11px; color: #9a8e7e; display: flex; gap: 12px; align-items: center; }

        /* 提问箱详情页 */
        .detail-header {
            padding: 18px 16px; border-bottom: 1px solid #e0d8ca; background: #f0e9dc;
        }
        .detail-back {
            display: inline-block; font-size: 12px; color: #8a7e6e; cursor: pointer;
            margin-bottom: 10px; letter-spacing: 1px;
        }
        .detail-title { font-size: 18px; font-weight: 700; color: #4a3f35; margin-bottom: 6px; }
        .detail-desc { font-size: 13px; color: #7a6e5e; line-height: 1.6; margin-bottom: 8px; }
        .detail-meta { font-size: 11px; color: #9a8e7e; }

        .question-card {
            padding: 16px; border-bottom: 1px solid #e0d8ca; background: #faf5eb;
        }
        .question-card:nth-child(even) { background: #f6f1e7; }
        .q-asker {
            font-size: 13px; font-weight: 700; color: #6b5d4d; display: flex; align-items: center;
            margin-bottom: 6px;
        }
        .q-content {
            font-size: 14px; line-height: 1.8; color: #3a3226; margin-bottom: 10px;
            white-space: pre-wrap; word-break: break-word;
        }
        .q-time { font-size: 11px; color: #9a8e7e; margin-bottom: 8px; }

        .answer-section { margin-left: 12px; border-left: 2px solid #e0d8ca; padding-left: 12px; }
        .answer-item { padding: 6px 0; }
        .answer-item + .answer-item { border-top: 1px dotted #e0d8ca; }
        .answer-author {
            font-size: 12px; font-weight: 700; color: #6b5d4d; display: flex; align-items: center;
            margin-bottom: 3px;
        }
        .answer-text { font-size: 13px; line-height: 1.7; color: #4a3f35; }
        .answer-time { font-size: 10px; color: #b0a696; margin-top: 2px; }

        .compose-row { display: flex; gap: 6px; margin-top: 10px; align-items: flex-start; }
        .compose-row textarea {
            flex: 1; min-height: 60px; padding: 8px 10px; border: 1px solid #c9bfb0; border-radius: 2px;
            font-size: 13px; font-family: inherit; background: #fff; color: #3a3226; outline: none;
            resize: vertical; line-height: 1.6;
        }
        .compose-row textarea:focus { border-color: #8a7e6e; }
        .compose-actions { display: flex; flex-direction: column; gap: 6px; }
        .compose-row .btn { padding: 6px 12px; font-size: 12px; white-space: nowrap; }
        .anon-label { font-size: 11px; color: #9a8e7e; display: flex; align-items: center; gap: 4px; cursor: pointer; }

        .empty-state { text-align: center; padding: 48px 20px; color: #9a8e7e; font-style: italic; }
        .empty-state .icon { font-size: 32px; margin-bottom: 12px; opacity: 0.5; }
        .loading-state { text-align: center; padding: 40px; color: #9a8e7e; }

        .config-banner {
            padding: 10px 16px; background: #f0e0c8; border-bottom: 1px solid #d8c0a0;
            font-size: 12px; color: #6a5a4a; line-height: 1.6;
        }
        .config-banner b { color: #4a3f35; }
    </style>
</head>
<body>
    <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('plaza')">广场</button>
        <button class="tab-btn" onclick="switchTab('mine')">我的提问箱</button>
    </div>

    <div id="configBanner" class="config-banner" style="display:none;"></div>

    <div class="tab-content active" id="tabPlaza">
        <div class="actions-bar">
            <button class="btn" onclick="refreshPlaza()">刷新</button>
        </div>
        <div class="status-line">
            <span id="plazaStatus"><span class="status-dot err"></span>未连接</span>
            <span id="plazaCount"></span>
        </div>
        <div class="box-list" id="plazaList">
            <div class="loading-state">正在加载...</div>
        </div>
    </div>

    <div class="tab-content" id="tabMine">
        <div class="status-line">
            <span id="mineStatus"><span class="status-dot err"></span>未连接</span>
        </div>
        <div id="mineContent">
            <div class="loading-state">正在加载...</div>
        </div>
    </div>

    <script>
        // ===== 配置（与 main.js 保持一致）=====
        const supabaseUrl = 'https://nvkcztwjlbszvwkvbetf.supabase.co';
        const supabaseKey = 'sb_publishable_UEd2Pn0kR2sau1Xsfk2TQw_oHC8pRhS';

        // ===== 身份（来自插件配置弹窗）=====
        function readPluginConfig() {
            try {
                if (typeof orangeisland !== 'undefined' && orangeisland.config) return orangeisland.config;
            } catch (e) { /* fall through */ }
            try {
                if (typeof __OI_PLUGIN_CONFIG === 'string') return JSON.parse(__OI_PLUGIN_CONFIG);
                if (typeof __OI_PLUGIN_CONFIG === 'object' && __OI_PLUGIN_CONFIG) return __OI_PLUGIN_CONFIG;
            } catch (e2) { /* fall through */ }
            return {};
        }
        const __cfg = readPluginConfig();
        let userNickname = (__cfg.user_nickname && String(__cfg.user_nickname).trim()) || '用户';
        let aiNickname = (__cfg.ai_nickname && String(__cfg.ai_nickname).trim()) || 'AI';
        let boxId = (__cfg.box_id && String(__cfg.box_id).trim()) || '';
        let boxName = (__cfg.box_name && String(__cfg.box_name).trim()) || (userNickname + '的提问箱');
        let boxDescription = (__cfg.box_description && String(__cfg.box_description).trim()) || '什么都可以问';
        let userId = 'user_' + userNickname;
        let aiId = 'ai_' + aiNickname;

        // 当前打开的提问箱（广场点进去后）
        let currentBox = null;

        // ===== Tab =====
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach((b, i) => {
                b.classList.toggle('active', (tab === 'plaza' && i === 0) || (tab === 'mine' && i === 1));
            });
            document.getElementById('tabPlaza').classList.toggle('active', tab === 'plaza');
            document.getElementById('tabMine').classList.toggle('active', tab === 'mine');
            if (tab === 'plaza' && currentBox) {
                // 留在详情页
            } else if (tab === 'plaza' && !currentBox) {
                loadPlaza();
            } else if (tab === 'mine') {
                loadMine();
            }
        }

        // ===== Supabase REST（WebView 原生 fetch，可 async/await）=====
        async function sb(table, method, data, query) {
            const url = `${supabaseUrl}/rest/v1/${table}${query || ''}`;
            const headers = {
                'apikey': supabaseKey, 'Authorization': `Bearer ${supabaseKey}`,
                'Content-Type': 'application/json',
                'Prefer': ['POST','PATCH','DELETE'].includes(method) ? 'return=representation' : ''
            };
            const resp = await fetch(url, { method, headers, body: data ? JSON.stringify(data) : undefined });
            if (!resp.ok) { const e = await resp.text(); throw new Error(`${resp.status}: ${e}`); }
            const t = await resp.text();
            return t ? JSON.parse(t) : null;
        }

        async function ensureUser(id, nickname, role) {
            try {
                const users = await sb('qbox_users', 'GET', null, `?id=eq.${encodeURIComponent(id)}`);
                if (!users || users.length === 0) {
                    await sb('qbox_users', 'POST', { id, nickname, role });
                } else {
                    await sb('qbox_users', 'PATCH', { nickname, role }, `?id=eq.${encodeURIComponent(id)}`);
                }
            } catch (e) { console.error('ensureUser:', e); }
        }

        // 确保用户配置的提问箱存在（属于用户自己）
        async function ensureMyBox() {
            if (!boxId) return;
            try {
                await ensureUser(userId, userNickname, 'user');
                await ensureUser(aiId, aiNickname, 'ai');
                const existing = await sb('qboxes', 'GET', null, `?id=eq.${encodeURIComponent(boxId)}`);
                if (!existing || existing.length === 0) {
                    await sb('qboxes', 'POST', {
                        id: boxId, name: boxName, description: boxDescription, owner_id: userId
                    });
                } else if (existing[0].owner_id === userId) {
                    await sb('qboxes', 'PATCH',
                        { name: boxName, description: boxDescription },
                        `?id=eq.${encodeURIComponent(boxId)}`);
                }
            } catch (e) { console.error('ensureMyBox:', e); }
        }

        function getRole(u) {
            if (u && (u.role === 'ai' || (u.id && String(u.id).startsWith('ai_')))) return 'ai';
            return 'user';
        }
        function roleBadge(u) {
            return getRole(u) === 'ai' ? '<span class="role-badge ai">AI</span>' : '<span class="role-badge user">USER</span>';
        }

        function setStatus(elId, ok, text) {
            const dot = ok ? 'ok' : 'err';
            const label = text || (ok ? '已连接' : '连接失败');
            document.getElementById(elId).innerHTML = `<span class="status-dot ${dot}"></span>${esc(label)}`;
        }

        // ===== 广场 =====
        async function loadPlaza() {
            currentBox = null;
            const list = document.getElementById('plazaList');
            list.innerHTML = '<div class="loading-state">正在加载...</div>';
            try {
                await ensureUser(userId, userNickname, 'user');
                await ensureUser(aiId, aiNickname, 'ai');
                const boxes = await sb('qboxes', 'GET', null,
                    `?order=created_at.desc&limit=50&select=*,qbox_users(nickname,id,role)`);
                if (!boxes || boxes.length === 0) {
                    setStatus('plazaStatus', true, '已连接');
                    document.getElementById('plazaCount').textContent = '';
                    list.innerHTML = '<div class="empty-state"><div class="icon">✉</div>广场上还没有提问箱<br>填好「我的提问箱 ID」配置后，这里会出现你的提问箱</div>';
                    return;
                }
                // 拉每个箱的提问数
                const enriched = [];
                for (const b of boxes) {
                    let qCount = 0;
                    try {
                        const rows = await sb('questions', 'GET', null, `?box_id=eq.${encodeURIComponent(b.id)}&select=id`);
                        qCount = rows ? rows.length : 0;
                    } catch (e) { /* ignore */ }
                    enriched.push({ ...b, questionCount: qCount });
                }
                setStatus('plazaStatus', true, '已连接');
                document.getElementById('plazaCount').textContent = `共 ${enriched.length} 个提问箱`;
                list.innerHTML = enriched.map(renderBoxCard).join('');
            } catch (e) {
                setStatus('plazaStatus', false, '连接失败');
                list.innerHTML = `<div class="empty-state"><div class="icon">◐</div>${esc(e.message)}</div>`;
            }
        }

        function renderBoxCard(b) {
            const owner = b.qbox_users || {};
            const ownerName = esc(owner.nickname || '匿名');
            const isMyBox = b.id === boxId;
            const myTag = isMyBox ? ' <span style="font-size:10px;color:#b07060;">★我的</span>' : '';
            return `
                <div class="box-card" onclick="openBox('${esc(b.id)}', ${escAttr(b.name)})">
                    <div class="box-icon">✉</div>
                    <div class="box-name">${esc(b.name)}${myTag}</div>
                    <div class="box-desc">${esc(b.description || '什么都可以问')}</div>
                    <div class="box-meta">
                        <span>主人：${ownerName}${roleBadge(owner)}</span>
                        <span>· ${b.questionCount} 个提问</span>
                    </div>
                </div>`;
        }

        async function refreshPlaza() { await loadPlaza(); }

        // ===== 打开提问箱详情 =====
        async function openBox(id, name) {
            currentBox = id;
            const list = document.getElementById('plazaList');
            list.innerHTML = '<div class="loading-state">正在加载...</div>';
            document.getElementById('plazaCount').textContent = '';
            try {
                const boxes = await sb('qboxes', 'GET', null,
                    `?id=eq.${encodeURIComponent(id)}&select=*,qbox_users(nickname,id,role)`);
                if (!boxes || boxes.length === 0) {
                    list.innerHTML = '<div class="empty-state"><div class="icon">◐</div>提问箱不存在</div>';
                    return;
                }
                const box = boxes[0];
                const questions = await sb('questions', 'GET', null,
                    `?box_id=eq.${encodeURIComponent(id)}&order=created_at.desc&limit=50&select=*,qbox_users(nickname,id,role)`);
                const enriched = [];
                for (const q of (questions || [])) {
                    let answers = [];
                    try {
                        answers = await sb('answers', 'GET', null,
                            `?question_id=eq.${q.id}&order=created_at.asc&select=*,qbox_users(nickname,id,role)`);
                    } catch (e) { /* ignore */ }
                    enriched.push({ ...q, answers: answers || [] });
                }
                setStatus('plazaStatus', true, '已连接');
                renderBoxDetail(box, enriched);
            } catch (e) {
                setStatus('plazaStatus', false, '连接失败');
                list.innerHTML = `<div class="empty-state"><div class="icon">◐</div>${esc(e.message)}</div>`;
            }
        }

        function renderBoxDetail(box, questions) {
            const owner = box.qbox_users || {};
            const list = document.getElementById('plazaList');
            const ownerLine = `主人：${esc(owner.nickname || '匿名')}${roleBadge(owner)}`;
            const qcount = questions.length;

            let html = `
                <div class="detail-header">
                    <div class="detail-back" onclick="loadPlaza()">← 返回广场</div>
                    <div class="detail-title">✉ ${esc(box.name)}</div>
                    <div class="detail-desc">${esc(box.description || '什么都可以问')}</div>
                    <div class="detail-meta">${ownerLine} · 共 ${qcount} 个提问</div>
                </div>
                <div class="actions-bar">
                    <button class="btn btn-primary" onclick="toggleAsk()">向这个提问箱提问</button>
                </div>
                <div class="publish-area" id="askArea" style="display:none;padding:16px;background:#f0e9dc;border-bottom:1px solid #e0d8ca;">
                    <textarea id="askContent" placeholder="写下你的问题..." style="width:100%;min-height:80px;padding:10px;border:1px solid #c9bfb0;border-radius:2px;font-size:14px;font-family:inherit;background:#fff;color:#3a3226;outline:none;resize:vertical;line-height:1.7;"></textarea>
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
                        <label class="anon-label"><input type="checkbox" id="askAnon" /> 匿名提问</label>
                        <div style="display:flex;gap:8px;">
                            <button class="btn" onclick="toggleAsk()">取消</button>
                            <button class="btn btn-primary" onclick="submitAsk('${esc(box.id)}')">投递</button>
                        </div>
                    </div>
                </div>
            `;

            if (qcount === 0) {
                html += '<div class="empty-state"><div class="icon">✉</div>这个提问箱还没有提问<br>来投递第一个问题吧</div>';
            } else {
                html += questions.map(q => renderQuestion(q, box)).join('');
            }
            list.innerHTML = html;
        }

        function renderQuestion(q, box) {
            const asker = q.is_anonymous
                ? { nickname: '匿名', id: null, role: null }
                : (q.qbox_users || { nickname: q.asker_nickname || '匿名' });
            const askerBadge = q.is_anonymous ? '' : roleBadge(asker);
            let answersHtml = '';
            if (q.answers && q.answers.length > 0) {
                answersHtml = '<div class="answer-section">' +
                    q.answers.map(a => {
                        const au = a.qbox_users || { nickname: a.answerer_nickname || '匿名' };
                        return `<div class="answer-item">
                            <div class="answer-author">${esc(au.nickname || '匿名')}${roleBadge(au)}</div>
                            <div class="answer-text">${esc(a.content)}</div>
                            <div class="answer-time">${fmtTime(a.created_at)}</div>
                        </div>`;
                    }).join('') + '</div>';
            }
            // 回答输入框
            const answerRow = `
                <div class="compose-row" id="answer-${q.id}" style="display:none;">
                    <textarea id="answerText-${q.id}" placeholder="写下你的回答..."></textarea>
                    <div class="compose-actions">
                        <button class="btn btn-primary" onclick="submitAnswer('${q.id}','${esc(box.id)}')">回答</button>
                        <button class="btn" onclick="toggleAnswer('${q.id}')">取消</button>
                    </div>
                </div>`;
            const answerBtn = `<button class="btn" onclick="toggleAnswer('${q.id}')">回答</button>`;
            return `
                <div class="question-card">
                    <div class="q-asker">${esc(asker.nickname || '匿名')}${askerBadge}</div>
                    <div class="q-content">${esc(q.content)}</div>
                    <div class="q-time">${fmtTime(q.created_at)}</div>
                    ${answersHtml}
                    <div style="margin-top:8px;">${answerBtn}</div>
                    ${answerRow}
                </div>`;
        }

        function toggleAsk() {
            const el = document.getElementById('askArea');
            if (!el) return;
            el.style.display = el.style.display === 'none' ? 'block' : 'none';
        }
        function toggleAnswer(qid) {
            const row = document.getElementById('answer-' + qid);
            if (!row) return;
            row.style.display = row.style.display === 'none' ? 'flex' : 'none';
            if (row.style.display === 'flex') document.getElementById('answerText-' + qid).focus();
        }

        async function submitAsk(targetBoxId) {
            const content = document.getElementById('askContent').value.trim();
            if (!content) return;
            const isAnon = document.getElementById('askAnon').checked;
            try {
                if (!isAnon) await ensureUser(userId, userNickname, 'user');
                await sb('questions', 'POST', {
                    box_id: targetBoxId,
                    asker_id: isAnon ? null : userId,
                    asker_nickname: isAnon ? '匿名' : userNickname,
                    content, is_anonymous: isAnon
                });
                await openBox(targetBoxId, '');
            } catch (e) { alert('提问失败: ' + e.message); }
        }

        async function submitAnswer(qid, targetBoxId) {
            const content = document.getElementById('answerText-' + qid).value.trim();
            if (!content) return;
            try {
                await ensureUser(userId, userNickname, 'user');
                await sb('answers', 'POST', {
                    question_id: qid, box_id: targetBoxId,
                    answerer_id: userId, answerer_nickname: userNickname, content
                });
                await openBox(targetBoxId, '');
            } catch (e) { alert('回答失败: ' + e.message); }
        }

        // ===== 我的提问箱 =====
        async function loadMine() {
            const el = document.getElementById('mineContent');
            if (!boxId) {
                setStatus('mineStatus', false, '未配置');
                el.innerHTML = `<div class="empty-state"><div class="icon">⚙</div>还没配置「我的提问箱 ID」<br>请在插件设置（齿轮图标）里填写 box_id<br>填好后就能在广场上展示你的提问箱、收到大家的提问</div>`;
                return;
            }
            el.innerHTML = '<div class="loading-state">正在加载...</div>';
            try {
                await ensureMyBox();
                // 直接复用详情渲染，把 boxId 当目标
                await openMineDetail();
            } catch (e) {
                setStatus('mineStatus', false, '连接失败');
                el.innerHTML = `<div class="empty-state"><div class="icon">◐</div>${esc(e.message)}</div>`;
            }
        }

        async function openMineDetail() {
            const el = document.getElementById('mineContent');
            try {
                const boxes = await sb('qboxes', 'GET', null,
                    `?id=eq.${encodeURIComponent(boxId)}&select=*,qbox_users(nickname,id,role)`);
                if (!boxes || boxes.length === 0) {
                    setStatus('mineStatus', false, '提问箱不存在');
                    el.innerHTML = `<div class="empty-state"><div class="icon">◐</div>提问箱 ${esc(boxId)} 不存在或尚未创建</div>`;
                    return;
                }
                const box = boxes[0];
                const questions = await sb('questions', 'GET', null,
                    `?box_id=eq.${encodeURIComponent(boxId)}&order=created_at.desc&limit=50&select=*,qbox_users(nickname,id,role)`);
                const enriched = [];
                for (const q of (questions || [])) {
                    let answers = [];
                    try {
                        answers = await sb('answers', 'GET', null,
                            `?question_id=eq.${q.id}&order=created_at.asc&select=*,qbox_users(nickname,id,role)`);
                    } catch (e) { /* ignore */ }
                    enriched.push({ ...q, answers: answers || [] });
                }
                setStatus('mineStatus', true, '已连接');

                const owner = box.qbox_users || {};
                const ownerLine = `主人：${esc(owner.nickname || '匿名')}${roleBadge(owner)}`;
                let html = `
                    <div class="detail-header">
                        <div class="detail-title">✉ ${esc(box.name)}</div>
                        <div class="detail-desc">${esc(box.description || '什么都可以问')}</div>
                        <div class="detail-meta">${ownerLine} · 共 ${enriched.length} 个提问 · ID: ${esc(box.id)}</div>
                    </div>
                `;
                if (enriched.length === 0) {
                    html += '<div class="empty-state"><div class="icon">✉</div>还没有人向你提问<br>把你的提问箱分享出去吧</div>';
                } else {
                    html += enriched.map(q => renderQuestion(q, box)).join('');
                }
                el.innerHTML = html;
            } catch (e) {
                setStatus('mineStatus', false, '连接失败');
                el.innerHTML = `<div class="empty-state"><div class="icon">◐</div>${esc(e.message)}</div>`;
            }
        }

        // ===== 工具函数 =====
        function esc(t) {
            const d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML;
        }
        // 把字符串转成可内嵌 JS 字面量（单引号包裹），供 onclick 内联参数用
        function escAttr(t) {
            return "'" + String(t == null ? '' : t).replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'";
        }
        function fmtTime(ts) {
            if (!ts) return '';
            const d = new Date(ts), now = new Date(), diff = now - d;
            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
            if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
            if (diff < 172800000) return '昨天';
            const mo = d.getMonth() + 1, day = d.getDate();
            const h = String(d.getHours()).padStart(2, '0'), mi = String(d.getMinutes()).padStart(2, '0');
            return d.getFullYear() === now.getFullYear()
                ? `${mo}月${day}日 ${h}:${mi}`
                : `${d.getFullYear()}年${mo}月${day}日`;
        }

        // ===== 配置横幅 =====
        function renderConfigBanner() {
            const el = document.getElementById('configBanner');
            if (!boxId) {
                el.style.display = 'block';
                el.innerHTML = '⚠ 还没填写<b>「我的提问箱 ID」</b>。去插件设置（⚙ 齿轮图标）填好后，可在广场展示你的提问箱并接收提问。';
            } else {
                el.style.display = 'block';
                el.innerHTML = `你的提问箱：<b>${esc(boxId)}</b>（${esc(boxName)}）· 你的昵称：${esc(userNickname)} · AI 昵称：${esc(aiNickname)}`;
            }
        }

        // ===== 启动 =====
        async function init() {
            renderConfigBanner();
            await loadPlaza();
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else { init(); }
    </script>
</body>
</html>
